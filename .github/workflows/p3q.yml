name: Build p3q

# Galaxy S21 Ultra 5G (Snapdragon) (p3q) flashable zip with KernelSU Next kernel.
#
# Optional repository secret:
#   P3Q_TARGET_FIRMWARE: target firmware string ("SM-G9980/<CSC>/<IMEI>"), if unset the value in
#                        target/p3q/config.sh is used. The target firmware itself is downloaded
#                        with samloader-rs, which does not need an IMEI.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/s21ultra-oneui-port-8zgkkl'
    paths:
      - '.github/scripts/prepare_p3q.sh'
      - '.github/workflows/p3q.yml'
      - 'platform/sm8350/**'
      - 'target/p3q/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SAMLOADER_RS_REF: '4dfea027767f3268e70dc130f169d459bd153cbf'
  CLANG_VERSION: 'r416183b'
  CLANG_URL: 'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz'

jobs:
  kernel:
    name: Build kernel (KernelSU Next)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up build environment
        timeout-minutes: 40
        run: |
          # apt can stall for hours on a slow mirror or a held dpkg lock: bound and retry every call
          APT_GET() {
              local i
              for i in 1 2 3; do
                  sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a timeout 600 apt-get -q \
                      -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 \
                      -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 "$@" && return 0
                  echo "::warning::apt-get $1 failed (attempt $i)"
                  sudo dpkg --configure -a || true
                  sleep 20
              done
              return 1
          }
          # The runner's default Ubuntu mirror can be very slow (~60 kB/s): switch to the fastest of a
          # few official mirrors. apt still verifies every package against the signed archive metadata.
          SELECT_APT_MIRROR() {
              local codename m out speed best="" best_speed=0
              codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
              for m in $(cut -f 1 /etc/apt/apt-mirrors.txt 2> /dev/null | grep -v security) \
                      http://azure.archive.ubuntu.com/ubuntu/ http://archive.ubuntu.com/ubuntu/ \
                      http://us.archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/; do
                  out="$(curl -s -o /dev/null --max-time 10 -w '%{http_code} %{speed_download}' \
                      "${m%/}/dists/$codename/main/binary-amd64/Packages.gz" || true)"
                  speed="${out#* }"
                  speed="${speed%.*}"
                  [[ "${out%% *}" == "200" && "$speed" =~ ^[0-9]+$ ]] || speed=0
                  echo "  $m: $((speed / 1024)) kB/s" >&2
                  if [ "$speed" -gt "$best_speed" ]; then
                      best="$m"
                      best_speed="$speed"
                  fi
              done
              echo "$best"
          }
          BEST_MIRROR="$(SELECT_APT_MIRROR)"
          echo "Ubuntu mirror: ${BEST_MIRROR:-unchanged}"
          if [ "$BEST_MIRROR" ] && [ -f /etc/apt/apt-mirrors.txt ]; then
              { printf '%s\tpriority:1\n' "$BEST_MIRROR"
                grep -v -F "$BEST_MIRROR" /etc/apt/apt-mirrors.txt | sed -E 's/priority:[0-9]+/priority:5/'; } \
                  > "$RUNNER_TEMP/apt-mirrors.txt"
              sudo cp "$RUNNER_TEMP/apt-mirrors.txt" /etc/apt/apt-mirrors.txt
          elif [ "$BEST_MIRROR" ]; then
              sudo sed -i -E "s#https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu/?#${BEST_MIRROR%/}/#g" \
                  /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2> /dev/null || true
          fi
          APT_GET update
          APT_GET install -y \
            bc bison cpio flex git kmod libelf-dev libssl-dev lz4 make python3 xz-utils

      - name: Restore clang toolchain
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang-${{ env.CLANG_VERSION }}
          key: clang-${{ env.CLANG_VERSION }}

      - name: Download clang toolchain
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          command: |
            rm -rf "$RUNNER_TEMP/clang-$CLANG_VERSION" && mkdir -p "$RUNNER_TEMP/clang-$CLANG_VERSION"
            curl -fsSL "$CLANG_URL" | tar -xz -C "$RUNNER_TEMP/clang-$CLANG_VERSION"
            "$RUNNER_TEMP/clang-$CLANG_VERSION/bin/clang" --version

      - name: Build kernel
        run: |
          CLANG_DIR="$RUNNER_TEMP/clang-$CLANG_VERSION" \
            ./target/p3q/kernel/build_kernel.sh "$RUNNER_TEMP/kernel" "$RUNNER_TEMP/kernel-out"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: p3q-kernel
          path: ${{ runner.temp }}/kernel-out
          if-no-files-found: error

  build:
    name: Build ROM
    needs: kernel
    runs-on: ubuntu-24.04

    env:
      P3Q_TARGET_FIRMWARE: ${{ secrets.P3Q_TARGET_FIRMWARE }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          # Keep the preinstalled clang/llvm/lld: purging them means downloading ~200 MB again from apt
          retain: 'compiler_cmake,compiler_llvm_clang'

      # The Ubuntu mirror can be very slow (~60 kB/s), keep the downloaded packages between runs
      - name: Restore apt package cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-archives-rom-v1-${{ github.run_id }}
          restore-keys: apt-archives-rom-v1-

      - name: Set up build environment
        timeout-minutes: 60
        run: |
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
          # apt can stall for hours on a slow mirror or a held dpkg lock: bound and retry every call
          APT_GET() {
              local i
              for i in 1 2 3; do
                  sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a timeout 900 apt-get -q \
                      -o Dir::Cache::Archives="$RUNNER_TEMP/apt-archives" \
                      -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 \
                      -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 "$@" && return 0
                  echo "::warning::apt-get $1 failed (attempt $i)"
                  sudo dpkg --configure -a || true
                  sleep 20
              done
              return 1
          }
          # The runner's default Ubuntu mirror can be very slow (~60 kB/s): switch to the fastest of a
          # few official mirrors. apt still verifies every package against the signed archive metadata.
          SELECT_APT_MIRROR() {
              local codename m out speed best="" best_speed=0
              codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
              for m in $(cut -f 1 /etc/apt/apt-mirrors.txt 2> /dev/null | grep -v security) \
                      http://azure.archive.ubuntu.com/ubuntu/ http://archive.ubuntu.com/ubuntu/ \
                      http://us.archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/; do
                  out="$(curl -s -o /dev/null --max-time 10 -w '%{http_code} %{speed_download}' \
                      "${m%/}/dists/$codename/main/binary-amd64/Packages.gz" || true)"
                  speed="${out#* }"
                  speed="${speed%.*}"
                  [[ "${out%% *}" == "200" && "$speed" =~ ^[0-9]+$ ]] || speed=0
                  echo "  $m: $((speed / 1024)) kB/s" >&2
                  if [ "$speed" -gt "$best_speed" ]; then
                      best="$m"
                      best_speed="$speed"
                  fi
              done
              echo "$best"
          }
          BEST_MIRROR="$(SELECT_APT_MIRROR)"
          echo "Ubuntu mirror: ${BEST_MIRROR:-unchanged}"
          if [ "$BEST_MIRROR" ] && [ -f /etc/apt/apt-mirrors.txt ]; then
              { printf '%s\tpriority:1\n' "$BEST_MIRROR"
                grep -v -F "$BEST_MIRROR" /etc/apt/apt-mirrors.txt | sed -E 's/priority:[0-9]+/priority:5/'; } \
                  > "$RUNNER_TEMP/apt-mirrors.txt"
              sudo cp "$RUNNER_TEMP/apt-mirrors.txt" /etc/apt/apt-mirrors.txt
          elif [ "$BEST_MIRROR" ]; then
              sudo sed -i -E "s#https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu/?#${BEST_MIRROR%/}/#g" \
                  /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2> /dev/null || true
          fi
          APT_GET update
          APT_GET install -y --no-install-recommends \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler secilc webp
          # Not available for every runner kernel, only needed to mount f2fs images (p3q has none)
          sudo DEBIAN_FRONTEND=noninteractive timeout 180 apt-get -q -y -o DPkg::Lock::Timeout=60 \
              install --no-install-recommends linux-modules-extra-$(uname -r) || true
          sudo modprobe erofs f2fs || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Save apt package cache
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-archives-rom-v1-${{ github.run_id }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build samloader-rs
        run: |
          git clone -q https://github.com/topjohnwu/samloader-rs "$RUNNER_TEMP/samloader-rs"
          git -C "$RUNNER_TEMP/samloader-rs" checkout -q "$SAMLOADER_RS_REF"
          cargo build --locked --release --package samloader --manifest-path "$RUNNER_TEMP/samloader-rs/Cargo.toml"
          echo "SAMLOADER_RS=$RUNNER_TEMP/samloader-rs/target/release/samloader" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        run: |
          source ./buildenv.sh p3q
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      # FUS rejects generated IMEIs for SM-G9980, samloader-rs downloads without one
      - name: Download target firmware
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 90
          max_attempts: 3
          retry_on: any
          command: |
            MODEL="$(cut -d "/" -f 1 <<< "$TARGET_FIRMWARE")"
            CSC="$(cut -d "/" -f 2 <<< "$TARGET_FIRMWARE")"
            VERSION="$("$SAMLOADER_RS" check-update --model "$MODEL" --region "$CSC" | cut -d "/" -f 1-3)"
            DIR="$ODIN_DIR/${MODEL}_${CSC}"
            echo "Downloading $MODEL ($CSC) $VERSION"
            rm -rf "$DIR" && mkdir -p "$DIR"
            "$SAMLOADER_RS" download --model "$MODEL" --region "$CSC" --version "$VERSION" --out-dir "$DIR"
            unzip -o "$DIR"/*.zip -d "$DIR" && rm -f "$DIR"/*.zip
            "$SAMLOADER_RS" verify-md5 "$DIR"/*.md5
            echo -n "$VERSION" > "$DIR/.downloaded"

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 90
          max_attempts: 3
          retry_on: any
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Check config and prepare stock-derived files
        run: ./.github/scripts/prepare_p3q.sh "$RUNNER_TEMP/p3q-stock"

      - name: Upload stock firmware report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3q-stock-files
          path: ${{ runner.temp }}/p3q-stock
          if-no-files-found: ignore

      - name: Download kernel
        uses: actions/download-artifact@v4
        with:
          name: p3q-kernel
          path: out/kernel/p3q

      - name: Build ROM
        run: ./scripts/make_rom.sh --build-rom-zip

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: UN1CA-p3q
          path: out/UN1CA_*.zip
          if-no-files-found: error
          compression-level: 0

      # Fails the run when the built ROM can not boot because of its SELinux files
      - name: Check SELinux files
        run: python3 ./.github/scripts/check_selinux.py out/target/p3q/work_dir
